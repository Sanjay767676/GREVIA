# Render Blueprint for the Grievia API.
#
# In Render: New -> Blueprint -> connect this repo. Render reads this file and
# creates the web service. Values marked "sync: false" are entered in the
# dashboard the first time, so no secrets live in git.
services:
  - type: web
    name: grievia-api
    runtime: node
    plan: free
    rootDir: backend
    # NODE_ENV=production makes npm skip devDependencies, but the build needs
    # TypeScript (a devDependency). --include=dev keeps tsc available.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase (database + storage) - enter in the dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: complaints
      # Secrets generated by Render on first deploy.
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Frontend origin, e.g. https://grievia.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      # Vercel and Render are different sites, so the session cookie is
      # cross-site. Both services must be HTTPS.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: SLA_SWEEP_INTERVAL_MS
        value: "60000"
